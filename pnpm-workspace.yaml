allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - vite@8.3.3
  - '@eslint-react/ast@5.24.6'
  - '@eslint-react/core@5.24.6'
  - '@eslint-react/eslint-plugin@5.24.6'
  - '@eslint-react/eslint@5.24.6'
  - '@eslint-react/jsx@5.24.6'
  - '@eslint-react/shared@5.24.6'
  - '@eslint-react/var@5.24.6'
  - eslint-plugin-react-dom@5.24.6
  - eslint-plugin-react-jsx@5.24.6
  - eslint-plugin-react-naming-convention@5.24.6
  - eslint-plugin-react-rsc@5.24.6
  - eslint-plugin-react-web-api@5.24.6
  - eslint-plugin-react-x@5.24.6
  - '@typescript-eslint/eslint-plugin@8.71.1'
  - '@typescript-eslint/parser@8.71.1'
  - '@typescript-eslint/project-service@8.71.1'
  - '@typescript-eslint/scope-manager@8.71.1'
  - '@typescript-eslint/tsconfig-utils@8.71.1'
  - '@typescript-eslint/type-utils@8.71.1'
  - '@typescript-eslint/types@8.71.1'
  - '@typescript-eslint/typescript-estree@8.71.1'
  - '@typescript-eslint/utils@8.71.1'
  - '@typescript-eslint/visitor-keys@8.71.1'
  - typescript-eslint@8.71.1
peerDependencyRules:
  allowedVersions:
    # some transitive tooling peers lag behind current eslint/typescript majors
    eslint: "*"
    typescript: "*"
